name: Monthly launch-data update
on:
  schedule:
    - cron: '15 6 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Gather and cautiously promote verified entries
        run: npm run update:monthly
      - name: Validate launch data
        run: npm run validate:data
      - name: Build dashboard
        run: npm run build
      - name: Commit refreshed data and report
        run: |
          git config user.name "smartphone-launch-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json reports/
          git diff --cached --quiet || git commit -m "chore(data): monthly launch radar update"
          git push
      - name: Notify by email webhook (optional)
        env:
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
        if: ${{ success() && env.NOTIFICATION_WEBHOOK_URL != '' }}
        run: |
          curl --fail --silent --show-error -X POST "$NOTIFICATION_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{"text":"Smartphone Launch Radar: mise à jour mensuelle terminée avec succès."}'
